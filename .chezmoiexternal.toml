{{ if (and (lookPath "tmux") (not (lookPath "psmux"))) }}
# if tmux installed, and psmux is not, clone the tmux plugins 'tpm' repo
[".config/tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
{{ end }}
